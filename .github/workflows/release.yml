name: Release

# A tag is the only thing that publishes: the updater in the app reads
# /releases/latest, so a release that exists but carries no APK would show up as
# an update the user cannot install. Building from a tag keeps the two in step.
on:
  push:
    tags:
      - 'v*'
  # Dry run: builds and uploads the APK as a workflow artifact without creating a
  # release, so the pipeline can be verified before the first tag goes out.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 is a versioned platform (`platforms;android-37.0`), and
      # AGP 9.4.1 wants the matching build-tools, so both are pinned by name.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      # The repository has no wrapper on purpose (the local toolchain is
      # vendored), so CI supplies the same Gradle the maintainer builds with.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Derive version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="1.1"
          fi

          # A versionCode has to be a single increasing integer. major*10000 +
          # minor*100 + patch gives room for 9999 patches per minor release,
          # which is far more than an Android version number needs.
          IFS='.' read -r major minor patch <<< "$version"
          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              ''|*[!0-9]*)
                echo "::error::tag '$REF_NAME' does not look like v<major>.<minor>.<patch>"
                exit 1
                ;;
            esac
          done
          code=$(( major * 10000 + minor * 100 + patch ))

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building HyperDuo $version ($code)"

      - name: Assemble release
        run: |
          gradle --no-daemon --stacktrace \
            -PhyperduoVersionName="${{ steps.version.outputs.version }}" \
            -PhyperduoVersionCode="${{ steps.version.outputs.code }}" \
            :app:assembleRelease

      # The updater picks the first .apk asset of the release, so the name is
      # part of the contract: it becomes the downloaded file name on the device.
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/HyperDuo-${{ steps.version.outputs.version }}.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDuo-${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
